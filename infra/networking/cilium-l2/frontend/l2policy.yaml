apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: frontend-l2
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
  serviceSelector:
    matchLabels:
      io.kubernetes.service.name: student-service-frontend
      io.kubernetes.service.namespace: student-service
