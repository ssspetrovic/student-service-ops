apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: student-service-dns-l2
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth[0-9]+
  serviceSelector:
    matchLabels:
      io.kubernetes.service.name: student-service-dns
      io.kubernetes.service.namespace: tailnet-dns
