apiVersion: v1
kind: ConfigMap
metadata:
    name: coredns
    namespace: kube-system
data:
    student-service.hosts: |
        192.168.1.240 student-service.internal
        192.168.1.241 harbor.student-service.internal
    Corefile: |
        .:53 {
            errors
            health {
                lameduck 5s
            }
            ready
            log . {
                class error
            }
            prometheus :9153

            kubernetes cluster.local in-addr.arpa ip6.arpa {
                pods insecure
                fallthrough in-addr.arpa ip6.arpa
                ttl 30
            }
            hosts /etc/coredns/student-service.hosts {
                fallthrough
            }
            forward . /etc/resolv.conf {
               max_concurrent 1000
            }
            cache 30 {
               disable success cluster.local
               disable denial cluster.local
            }
            loop
            reload
            loadbalance
        }
    TailnetCorefile: |
        student-service.internal:53 {
            errors
            health :8080 {
                lameduck 5s
            }
            ready :8181
            hosts /etc/coredns/tailnet/student-service.hosts {
                ttl 60
                no_reverse
            }
            reload
        }
