apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: "1.18.3"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: harbor-values
      valuesKey: values.yaml
  values:
    expose:
      type: loadBalancer
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      loadBalancer:
        IP: "192.168.1.241"
    externalURL: https://harbor.student-service.internal
    updateStrategy:
      type: Recreate
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: local-path
          size: 180Gi
        jobservice:
          jobLog:
            storageClass: local-path
            size: 1Gi
        database:
          storageClass: local-path
          size: 5Gi
        redis:
          storageClass: local-path
          size: 2Gi
        trivy:
          storageClass: local-path
          size: 5Gi
    database:
      type: internal
    redis:
      type: internal
    trivy:
      enabled: false
    metrics:
      enabled: false
