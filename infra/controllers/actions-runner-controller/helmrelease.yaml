apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 30m
  releaseName: arc
  targetNamespace: arc-systems
  storageNamespace: arc-systems
  chartRef:
    kind: OCIRepository
    name: actions-runner-controller
    namespace: flux-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
