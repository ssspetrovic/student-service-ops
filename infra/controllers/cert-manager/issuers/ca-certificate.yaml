apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: student-service-root-ca
  namespace: cert-manager
spec:
  commonName: student-service-root-ca
  isCA: true
  secretName: student-service-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: student-service-bootstrap-selfsigned
