[settings]
lockfile = true

[tools]
flux2 = "2.8.5"
helm = "3.20.2"
jq = "1.8.1"
python = "3.14.5"
talosctl = "1.12.6"
kubectl = "1.36.0"
sops = "3.12.2"
uv = "0.11.7"
yq = "4.49.2"

[tasks.lint]
description = "Run the baseline repo validation suite"
depends = ["lint:yaml", "lint:markdown", "lint:sh", "lint:actions", "lint:kubernetes"]

[tasks."lint:fix"]
description = "Apply available lint fixes, then rerun the baseline lint suite"
depends = ["lint:fix:yaml", "lint:fix:markdown", "lint:fix:sh"]
run = "mise run lint"

[tasks."lint:yaml"]
description = "Lint YAML files with repo rules"
tools.uv = "0.11.7"
run = "uvx --from yamllint==1.37.1 yamllint -c .yamllint.yml ."

[tasks."lint:fix:yaml"]
description = "Format YAML files with yamlfmt"
tools."aqua:google/yamlfmt" = "0.17.2"
run = "yamlfmt"

[tasks."lint:markdown"]
description = "Lint Markdown files"
tools.node = "24.15.0"
run = "npx --yes markdownlint-cli2@0.22.0"

[tasks."lint:fix:markdown"]
description = "Apply auto-fixable Markdown lint rules"
tools.node = "24.15.0"
run = "npx --yes markdownlint-cli2@0.22.0 --fix"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
tools.actionlint = "1.7.8"
tools.shellcheck = "0.11.0"
run = "actionlint -config-file .github/actionlint.yaml"

[tasks."lint:sh"]
description = "Lint shell scripts"
tools.shellcheck = "0.11.0"
run = "./scripts/lint-shell.sh"

[tasks."lint:fix:sh"]
description = "Format shell scripts with shfmt"
tools.shfmt = "3.12.0"
run = "./scripts/lint-shell.sh --fix"

[tasks."lint:kubernetes"]
description = "Validate built-in Kubernetes manifests with kubeconform"
tools.kubeconform = "0.6.7"
run = "./scripts/lint-kubernetes.sh"
