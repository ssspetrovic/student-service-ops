[settings]
lockfile = true

[env]
NODE_VERSION = "24.16.0"

[tools]
flux2 = "2.8.5"
helm = "3.20.2"
jq = "1.8.1"
pre-commit = "4.6.0"
python = "3.14.5"
talosctl = "1.12.6"
kubectl = "1.36.0"
sops = "3.12.2"
uv = "0.11.7"
yq = "4.49.2"

[tasks.lint]
description = "Run the baseline repo validation suite"
depends = ["lint:yaml", "lint:markdown", "lint:sh", "lint:actions", "lint:zizmor", "lint:kubernetes"]

[tasks."lint:fix"]
description = "Apply available lint fixes, then rerun the baseline lint suite"
depends = ["lint:fix:yaml", "lint:fix:markdown", "lint:fix:sh"]
run = "mise run lint"

[tasks."lint:yaml"]
description = "Lint YAML files with repo rules"
tools.uv = "0.11.7"
run = "uvx --from yamllint==1.37.1 yamllint -c .yamllint.yml ."

[tasks."lint:fix:yaml"]
description = "Format YAML files with yamlfmt"
tools."aqua:google/yamlfmt" = "0.17.2"
run = "yamlfmt"

[tasks."lint:markdown"]
description = "Lint Markdown files"
tools.node = "{{ env.NODE_VERSION }}"
run = "npx --yes markdownlint-cli2@0.22.0"

[tasks."lint:fix:markdown"]
description = "Apply auto-fixable Markdown lint rules"
tools.node = "{{ env.NODE_VERSION }}"
run = "npx --yes markdownlint-cli2@0.22.0 --fix"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
tools.actionlint = "1.7.8"
tools.shellcheck = "0.11.0"
run = "actionlint -config-file .github/actionlint.yaml"

[tasks."lint:zizmor"]
description = "Scan GitHub Actions workflows for security issues with zizmor"
tools.uv = "0.11.7"
run = "uvx --from zizmor==1.25.2 zizmor --offline --persona regular --min-severity medium ."

[tasks."lint:sh"]
description = "Lint shell scripts"
tools.shellcheck = "0.11.0"
run = "./scripts/lint-shell.sh"

[tasks."lint:fix:sh"]
description = "Format shell scripts with shfmt"
tools.shfmt = "3.12.0"
run = "./scripts/lint-shell.sh --fix"

[tasks."lint:kubernetes"]
description = "Validate built-in Kubernetes manifests with kubeconform"
tools.kubeconform = "0.6.7"
run = "./scripts/lint-kubernetes.sh"

[tasks."pre-commit:install"]
description = "Install the repo pre-commit hook"
run = "pre-commit install"

[tasks."pre-commit:run"]
description = "Run pre-commit hooks against all tracked files"
run = "pre-commit run --all-files"

[tasks."backend:sync"]
description = "Install backend dependencies from the lockfile"
run = "cd backend && uv sync --frozen"

[tasks."backend:lint"]
description = "Lint backend Python code"
run = "cd backend && uv run ruff check ."

[tasks."backend:format"]
description = "Format backend Python code"
run = "cd backend && uv run ruff format ."

[tasks."backend:test"]
description = "Run backend tests"
run = "cd backend && uv run pytest"

[tasks."backend:check"]
description = "Run Django system checks with local settings"
run = "cd backend && uv run python manage.py check"

[tasks."backend:run"]
description = "Run the backend development server"
run = "cd backend && uv run python manage.py runserver"

[tasks."backend:migrate"]
description = "Apply backend database migrations"
run = "cd backend && uv run python manage.py migrate"

[tasks."backend:makemigrations"]
description = "Create backend database migrations"
run = "cd backend && uv run python manage.py makemigrations"

[tasks."frontend:sync"]
description = "Install frontend dependencies from the lockfile"
tools.node = "{{ env.NODE_VERSION }}"
run = """
if [ ! -f frontend/package.json ]; then
  echo "frontend/package.json does not exist yet; skipping frontend dependency sync."
elif [ -f frontend/package-lock.json ]; then
  cd frontend && npm ci
else
  echo "frontend/package-lock.json is required for frontend CI." >&2
  exit 1
fi
"""

[tasks."frontend:run"]
description = "Run the frontend development server"
tools.node = "{{ env.NODE_VERSION }}"
run = "cd frontend && npm run dev"

[tasks."frontend:lint"]
description = "Lint frontend code"
tools.node = "{{ env.NODE_VERSION }}"
run = """
if [ ! -f frontend/package.json ]; then
  echo "frontend/package.json does not exist yet; skipping frontend lint."
else
  cd frontend && npm run lint --if-present
fi
"""

[tasks."frontend:test"]
description = "Run frontend tests"
tools.node = "{{ env.NODE_VERSION }}"
run = """
if [ ! -f frontend/package.json ]; then
  echo "frontend/package.json does not exist yet; skipping frontend tests."
else
  cd frontend && npm test --if-present
fi
"""

[tasks."frontend:build"]
description = "Build frontend assets"
tools.node = "{{ env.NODE_VERSION }}"
run = """
if [ ! -f frontend/package.json ]; then
  echo "frontend/package.json does not exist yet; skipping frontend build."
else
  cd frontend && npm run build --if-present
fi
"""
