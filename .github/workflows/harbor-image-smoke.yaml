name: Harbor Image Smoke Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  image-smoke:
    runs-on: student-service-runner
    env:
      IMAGE: harbor.student-service.internal/student-service/arc-smoke:${{
        github.run_id }}
    steps:
      - name: Check Docker
        run: docker version

      - name: Log in to Harbor
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: harbor.student-service.internal
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build image
        run: |
          cat > Dockerfile <<'EOF'
          FROM alpine:3.20
          CMD ["echo", "hello from Harbor image smoke test"]
          EOF
          docker build --pull -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Pull image
        run: |
          docker rmi "$IMAGE"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE"
