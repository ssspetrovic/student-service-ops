name: Backend Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - backend/**
      - "!backend/**/*.md"
      - .github/workflows/backend-image.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: harbor.student-service.internal/student-service/backend

jobs:
  backend-image:
    name: Backend image
    runs-on: student-service-runner
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed paths
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --quiet "$BASE_SHA"...HEAD -- \
            backend/ \
            ':(exclude)backend/*.md' \
            .github/workflows/backend-image.yaml
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.changes.outputs.skip != 'true'
        run: docker build --pull -t "$IMAGE:$GITHUB_SHA" backend

      - name: Log in to Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: harbor.student-service.internal
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  promote-backend:
    name: Promote backend image
    needs: backend-image
    if: github.event_name == 'push'
    runs-on: student-service-runner
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: true
          install_args: yq
          cache: true

      - name: Update backend image
        run: scripts/update-backend-image.sh "$GITHUB_SHA"

      - name: Create or update deployment pull request
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.GITOPS_PROMOTION_PAT }}
          branch: automation/backend-image
          base: main
          delete-branch: true
          add-paths: |
            apps/student-service/backend/bootstrap/job.yaml
            apps/student-service/backend/deployment.yaml
          commit-message: "chore: auto-promote backend image"
          title: "chore: auto-promote backend image"
          body: "Promote `${{ env.IMAGE }}:${{ github.sha }}`."
