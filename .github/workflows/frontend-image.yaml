name: Frontend Image

on:
  pull_request:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-image.yaml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-image.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: harbor.student-service.internal/student-service/frontend

jobs:
  frontend-image:
    name: Frontend image
    runs-on: student-service-runner
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull -t "$IMAGE:$GITHUB_SHA" frontend

      - name: Log in to Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: harbor.student-service.internal
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

  promote-frontend:
    name: Promote frontend image
    needs:
      - frontend-image
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.frontend-image.result == 'success'
    runs-on: student-service-runner
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: true
          install_args: yq
          cache: true

      - name: Check deployment token
        env:
          GITOPS_PROMOTION_PAT: ${{ secrets.GITOPS_PROMOTION_PAT }}
        run: |
          if [[ -z "$GITOPS_PROMOTION_PAT" ]]; then
            echo "GITOPS_PROMOTION_PAT is required for image promotion." >&2
            exit 1
          fi

      - name: Update frontend image
        run: scripts/update-frontend-image.sh "$GITHUB_SHA"

      - name: Create or update deployment pull request
        uses: peter-evans/create-pull-request@98357b18bf14b5342f975ff684046ec3b2a07725 # v8.0.0
        with:
          token: ${{ secrets.GITOPS_PROMOTION_PAT }}
          branch: automation/frontend-image
          base: main
          delete-branch: true
          add-paths: apps/student-service/frontend/deployment.yaml
          commit-message: "chore: auto-promote frontend image"
          title: "chore: auto-promote frontend image"
          body: |
            Promote the frontend image built from `${{ github.sha }}`:

            `${{ env.IMAGE }}:${{ github.sha }}`
