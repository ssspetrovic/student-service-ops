name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run yamllint
        run: mise run lint:yaml

      - name: Run markdownlint
        run: mise run lint:markdown

      - name: Run shell lint
        run: mise run lint:sh

      - name: Run actionlint
        run: mise run lint:actions

      - name: Run kubeconform
        run: mise run lint:kubernetes
