name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yaml:
    name: YAML
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run yamllint
        run: mise run lint:yaml

  markdown:
    name: Markdown
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run markdownlint
        run: mise run lint:markdown

  shell:
    name: Shell
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run shell lint
        run: mise run lint:sh

  actions:
    name: GitHub Actions
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run actionlint
        run: mise run lint:actions

  kubernetes:
    name: Kubernetes
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Run kubeconform
        run: mise run lint:kubernetes
