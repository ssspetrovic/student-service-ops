name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: student-service-runner
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: true
          cache: true

      - name: Run yamllint
        run: mise run lint:yaml

      - name: Run markdownlint
        run: mise run lint:markdown

      - name: Run shell lint
        run: mise run lint:sh

      - name: Test image promotion scripts
        run: mise run test:image-promotion

      - name: Run actionlint
        run: mise run lint:actions

      - name: Run kubeconform
        run: mise run lint:kubernetes
