apiVersion: batch/v1
kind: Job
metadata:
  name: student-service-migrations
  namespace: student-service
  labels:
    app.kubernetes.io/name: student-service-backend
    app.kubernetes.io/component: migrations
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-service-backend
        app.kubernetes.io/component: migrations
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: harbor.student-service.internal/student-service/backend:9a51969fa8ee10830533fda6c9c044a7de1cbd58
          imagePullPolicy: IfNotPresent
          command:
            - .venv/bin/python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: student-service-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-service-db-app
                  key: uri
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: student-service-backend
                  key: DJANGO_SECRET_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
