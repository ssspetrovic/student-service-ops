apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-service-backend
  namespace: student-service
  labels:
    app.kubernetes.io/name: student-service-backend
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: student-service-backend
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-service-backend
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: harbor.student-service.internal/student-service/backend:42cccc328099d789d09b86e3f31d5d6335cd43d6
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: student-service-backend-config
            - secretRef:
                name: student-service-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-service-db-app
                  key: uri
          readinessProbe:
            httpGet:
              path: /api/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: student-service-backend.student-service.svc.cluster.local
            initialDelaySeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: student-service-backend.student-service.svc.cluster.local
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
