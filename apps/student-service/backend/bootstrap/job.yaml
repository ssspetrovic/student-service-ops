apiVersion: batch/v1
kind: Job
metadata:
  name: student-service-migrations
  namespace: student-service
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-service-backend
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrations
          image: harbor.student-service.internal/student-service/backend:7ec5e5c036ad4ce30a9b7e146e547218fdf6b4c4
          command: [".venv/bin/python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: student-service-backend-config
            - secretRef:
                name: student-service-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: student-service-db-app
                  key: uri
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
