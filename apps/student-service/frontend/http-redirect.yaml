apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: student-service-frontend-http-redirect
  namespace: student-service
  labels:
    app.kubernetes.io/name: student-service-frontend
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
      sectionName: http
  hostnames:
    - student-service.internal
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
