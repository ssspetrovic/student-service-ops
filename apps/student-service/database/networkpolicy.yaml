apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: student-service-db-ingress
  namespace: student-service-database
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: student-service-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: student-service-db
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: student-service
          podSelector:
            matchLabels:
              app.kubernetes.io/name: student-service-backend
      ports:
        - protocol: TCP
          port: 5432
