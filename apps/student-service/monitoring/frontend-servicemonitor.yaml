apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: student-service-frontend
  namespace: student-service
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: student-service-frontend
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 15s
