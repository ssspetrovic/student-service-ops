apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: student-service-migrations
  namespace: flux-system
spec:
  dependsOn:
    - name: student-service-database
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./apps/student-service/backend/bootstrap
  prune: true
  force: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
