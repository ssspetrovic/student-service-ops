apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailnet-dns
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-l2
  interval: 10m
  path: ./infra/networking/tailnet-dns
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: student-service-dns
      namespace: tailnet-dns
