apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  dependsOn:
    - name: infra
  interval: 24h
  path: ./deploy
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: local-path-provisioner
    namespace: flux-system
  patches:
    - patch: |-
        apiVersion: v1
        kind: Namespace
        metadata:
          name: local-path-storage
          labels:
            pod-security.kubernetes.io/enforce: privileged
      target:
        kind: Namespace
        name: local-path-storage
    - patch: |-
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: local-path-config
          namespace: local-path-storage
        data:
          config.json: |-
            {
                    "nodePathMap":[
                    {
                            "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                            "paths":["/var/mnt/local-path-provisioner"]
                    }
                    ]
            }
      target:
        kind: ConfigMap
        name: local-path-config
        namespace: local-path-storage
    - patch: |-
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: local-path
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
      target:
        kind: StorageClass
        name: local-path
