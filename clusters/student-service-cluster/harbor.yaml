apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
    - name: cilium-l2
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./infra/registry/harbor
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
