apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: student-service-frontend
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-issuers
    - name: student-service-backend
    - name: cilium-l2
  interval: 10m
  path: ./apps/student-service/frontend
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
