apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: gateway-api
    - name: tailnet-dns
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./infra/monitoring/kube-prometheus-stack
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
