apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: harbor-certificates
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-issuers
  interval: 10m
  path: ./infra/registry/certificates
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
