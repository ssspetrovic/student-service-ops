apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: student-service-database
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: storage
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 10m
  path: ./apps/student-service/database
  prune: true
  wait: true
  timeout: 15m
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: student-service-db
      namespace: student-service-database
  sourceRef:
    kind: GitRepository
    name: flux-system
