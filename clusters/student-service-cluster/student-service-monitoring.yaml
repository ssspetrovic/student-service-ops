apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: student-service-monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: kube-prometheus-stack
    - name: student-service-backend
    - name: student-service-frontend
  interval: 10m
  path: ./apps/student-service/monitoring
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
