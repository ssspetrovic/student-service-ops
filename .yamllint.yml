extends: default

ignore: |
  .agents/
  .codex/
  *.sops.yaml
  entities.json
  mempalace.yaml
  talos/clusterconfig/
  talos/talsecret.sops.yaml
  clusters/*/flux-system/
  .github/workflows/

rules:
  comments:
    min-spaces-from-content: 1
  document-start: disable
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ["true", "false"]
    check-keys: true
