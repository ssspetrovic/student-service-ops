[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Srdjan Petrovic", email = "s.petrovic852@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0.5,<6.1",
    "django-cors-headers>=4.9.0,<4.10",
    "django-environ>=0.13.0,<0.14",
    "djangorestframework>=3.17.1,<3.18",
    "djangorestframework-simplejwt>=5.5.1,<5.6",
    "gunicorn>=26.0.0,<27.0",
    "psycopg[binary]>=3.3.4,<3.4",
    "whitenoise>=6.12.0,<6.13",
]

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
    "coverage>=7.13.5,<7.14",
    "pytest>=9.0.3,<9.1",
    "pytest-django>=4.12.0,<4.13",
    "ruff>=0.15.13,<0.16",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
